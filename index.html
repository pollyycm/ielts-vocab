<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Vocabulary Master</title><style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;background:linear-gradient(135deg,#f8fafc,#eef2ff);color:#172033}.app{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.tag{background:#eef2ff;color:#4338ca;padding:7px 10px;border-radius:999px;font-size:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 14px 36px #1f293711}.filters{padding:15px;margin:18px 0;display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:9px}select,input,button{font:inherit}select,input{border:1px solid #e5e7eb;border-radius:11px;padding:10px 11px;outline:none}.grid{display:grid;grid-template-columns:1fr 310px;gap:18px}.main,.side{padding:23px}.wordrow{display:flex;justify-content:space-between;gap:16px}.word{font-size:43px;font-weight:800;letter-spacing:-1px}.ipa,.muted{color:#667085}.meaning{font-size:20px;font-weight:700;margin:16px 0}.freqs,.actions{display:flex;gap:8px;flex-wrap:wrap}.freq{background:#fafafa;border:1px solid #e5e7eb;border-radius:10px;padding:7px 9px;font-size:12px}.freq b{color:#f59e0b}.hr{height:1px;background:#e5e7eb;margin:20px 0}.example{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:13px;padding:15px;min-height:74px;line-height:1.65}.ex-en{font-size:16px;font-weight:600}.ex-cn{margin-top:7px;color:#667085;font-size:14px}.spell{display:flex;gap:8px}.spell input{flex:1}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}.soft{background:#f2f4f7}.good{background:#ecfdf3;color:#027a48}.bad{background:#fef3f2;color:#b42318}.speak{width:44px;height:44px;border-radius:50%}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f2f4}.note{font-size:13px;line-height:1.6;color:#667085;background:#fafafa;padding:12px;border-radius:12px;margin-top:14px}.topic{display:inline-block;background:#f2f4f7;padding:5px 8px;border-radius:8px;font-size:12px;color:#475467;margin-top:8px}.active{outline:2px solid #c7d2fe;background:#eef2ff}@media(max-width:820px){.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.filters{grid-template-columns:1fr}.app{padding:14px}.word{font-size:36px}}</style></head><body><div class="app"><div class="top"><div><h1 style="margin:0">IELTS Vocabulary Master</h1><div class="muted" style="margin-top:6px">Writing / Reading / Listening 分级 · 拼写 · 发音 · 双语例句 · 自动保存进度</div></div><div id="status" class="tag">正在加载完整词库…</div></div><div class="card filters"><select id="mod"><option value="all">全部模块</option><option value="writing">Writing</option><option value="reading">Reading</option><option value="listening">Listening</option></select><select id="freq"><option value="all">全部频率</option><option value="3">★★★ 高频</option><option value="2">★★ 常用</option><option value="1">★ 补充</option></select><select id="topic"><option value="all">全部主题</option></select><input id="q" placeholder="搜索单词 / 中文释义"></div><div class="grid"><main class="card main"><div class="wordrow"><div><div id="word" class="word">Loading…</div><div id="ipa" class="ipa"></div><div id="topicTag" class="topic"></div></div><button id="speak" class="soft speak">🔊</button></div><div id="meaning" class="meaning"></div><div class="freqs"><div class="freq">Writing <b id="fw"></b></div><div class="freq">Reading <b id="fr"></b></div><div class="freq">Listening <b id="fl"></b></div></div><div class="hr"></div><b>简单例句</b><div class="example" style="margin-top:9px"><div id="exEn" class="ex-en"></div><div id="exCn" class="ex-cn"></div></div><div class="actions" style="margin-top:10px"><button id="newex" class="soft">换一个例句</button><button id="spex" class="soft">朗读英文例句</button></div><div class="hr"></div><b>拼写练习</b><div class="spell" style="margin-top:9px"><input id="spell" placeholder="输入英文单词…"><button id="check" class="primary">检查</button></div><div id="fb" style="min-height:22px;margin-top:8px"></div><div class="actions"><button id="known" class="good">✓ 我认识</button><button id="review" class="bad">↺ 再复习</button><button id="next" class="primary">下一个 →</button><button id="random" class="soft">随机</button></div></main><aside class="card side"><h3 style="margin-top:0">学习控制台</h3><div class="actions"><button id="allmode" class="soft">筛选词库</button><button id="unknownmode" class="soft">只复习生词</button></div><div class="stat"><span>当前筛选</span><b id="count">0</b></div><div class="stat"><span>已学习</span><b id="seen">0</b></div><div class="stat"><span>已掌握</span><b id="kcount">0</b></div><div class="stat"><span>待复习</span><b id="ucount">0</b></div><div class="stat"><span>当前位置</span><b id="pos">0 / 0</b></div><div class="note">页面会自动保存：当前单词、筛选条件、复习模式、已学习/已掌握/待复习。下次用同一浏览器打开同一网址会自动恢复。</div><div class="actions"><button id="reset" class="soft">重置学习记录</button></div></aside></div></div><script>const URL='https://raw.githubusercontent.com/LynnShaw/vocabulary_for_ielts/main/word_list.csv',A=new Set('analyse analysis approach assess assume authority benefit concept conduct consequence consistent context contribute crucial data define demonstrate derive determine economy efficient eliminate emerge emphasis enable ensure establish evaluate evidence factor framework fundamental generate identify illustrate impact imply indicate individual interpret investigate issue maintain method objective obtain perspective policy potential precise predict primary principle priority procedure promote relevant require research resource respond restrict retain reveal role sector significant specific strategy structure sufficient sustainable theory trend valid alternative capacity category component comprehensive concentrate confirm constraint construct contrast convert cooperate core correspond decline enhance expand explicit facilitate feature financial focus impose incentive infrastructure initial innovative integrate investment major modify monitor participate perceive pursue regulate rely select shift source target technical transfer achieve'.split(' ')),W=['教育','社会','环境','经济','科技','文化','媒体','政府','法律','健康','城市','工作','能源','交通','人口'],L=['生活','教育','旅游','交通','住房','工作','健康','购物','娱乐','校园','银行','地理','自然','天气','动物','文化'],T=['自然地理','天文','地质','生物','化学','物理','考古','农业','医学','动物','植物','科学'],KEY='ivStateV2';let all=[],list=[],i=0,rev=false,currentExample=null,state={};const $=x=>document.getElementById(x),has=(s,a)=>a.some(x=>s.includes(x)),stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);function loadState(){try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){state={}}}loadState();let seen=new Set(state.seen||[]),known=new Set(state.known||[]),unknown=new Set(state.unknown||[]);function persist(){let x=cur();state={seen:[...seen],known:[...known],unknown:[...unknown],mod:$('mod').value,freq:$('freq').value,topic:$('topic').value,q:$('q').value,rev,currentWord:x?x.w:(state.currentWord||''),updatedAt:Date.now()};localStorage.setItem(KEY,JSON.stringify(state))}function score(x){let w=2,r=3,l=2,n=x.w.toLowerCase(),t=x.topic;if(A.has(n))w=3;if(has(t,W))w=3;if(has(t,L))l=3;if(has(t,T)&&!A.has(n)){w=Math.min(w,2);l=Math.min(l,2)}if(n.length<=7&&!has(t,T))l=3;if(n.length>=13&&!A.has(n))l=Math.min(l,2);return{writing:w,reading:r,listening:l}}function pos(m){m=m.toLowerCase();return /^v[ti.]|^v\./.test(m)?'v':/^adj\./.test(m)?'adj':/^adv\./.test(m)?'adv':'n'}function parse(s){return s.replace(/^\ufeff/,'').split(/\r?\n/).slice(1).map(line=>{let p=line.split(',');if(p.length<5)return null;let x={w:p[0].trim(),ipa:p.at(-1).trim(),topic:p.at(-2).replace(/^Chapter\s*\d+\s*/i,'').trim()||'综合',cn:p.slice(1,-3).join(',').trim()};x.pos=pos(x.cn);x.f=score(x);return x}).filter(Boolean)}function cleanMeaning(x,rx){return x.cn.replace(rx,'').split(/[；，,]/)[0]}function ex(x){let a;if(x.pos==='v'){let m=cleanMeaning(x,/^v[^ ]*\s*/i);a=[{en:`We should ${x.w} this issue carefully.`,cn:`我们应该谨慎地${m}这个问题。`},{en:`Experts may ${x.w} the problem in different ways.`,cn:`专家可能会以不同方式${m}这个问题。`}]}else if(x.pos==='adj'){let m=cleanMeaning(x,/^adj\.\s*/i);a=[{en:`This is a ${x.w} issue in modern society.`,cn:`这是现代社会中一个${m}的问题。`},{en:`The report describes a ${x.w} change.`,cn:`报告描述了一个${m}的变化。`}]}else if(x.pos==='adv'){let m=cleanMeaning(x,/^adv\.\s*/i);a=[{en:`The situation changed ${x.w} over time.`,cn:`随着时间推移，情况${m}地发生了变化。`},{en:`The figure increased ${x.w} during the period.`,cn:`在这一时期，该数字${m}地上升。`}]}else{let m=cleanMeaning(x,/^n\.\s*/i);a=[{en:`The report discusses ${x.w} in relation to ${x.topic}.`,cn:`这份报告从“${x.topic}”主题出发讨论了“${x.w}（${m}）”。`},{en:`Researchers are studying ${x.w} more closely.`,cn:`研究人员正在更深入地研究“${x.w}（${m}）”。`}]}return a[Math.random()*a.length|0]}function showEx(x){currentExample=ex(x);$('exEn').textContent=currentExample.en;$('exCn').textContent=currentExample.cn}function topics(){let arr=[...new Set(all.map(x=>x.topic))].sort((a,b)=>a.localeCompare(b,'zh-CN'));$('topic').innerHTML='<option value="all">全部主题</option>'+arr.map(x=>`<option>${x}</option>`).join('')}function restoreControls(){if(state.mod)$('mod').value=state.mod;if(state.freq)$('freq').value=state.freq;if(state.q)$('q').value=state.q;if(state.topic&&[...$('topic').options].some(o=>o.value===state.topic))$('topic').value=state.topic;rev=!!state.rev;$('unknownmode').classList.toggle('active',rev);$('allmode').classList.toggle('active',!rev)}function filter(restoreWord=false){let m=$('mod').value,f=$('freq').value,t=$('topic').value,q=$('q').value.toLowerCase();list=all.filter(x=>(!rev||unknown.has(x.w))&&(t==='all'||x.topic===t)&&(!q||x.w.toLowerCase().includes(q)||x.cn.toLowerCase().includes(q))&&(f==='all'||(m==='all'?Math.max(x.f.writing,x.f.reading,x.f.listening):x.f[m])==f));if(restoreWord&&state.currentWord){let idx=list.findIndex(x=>x.w===state.currentWord);i=idx>=0?idx:0}else i=Math.min(i,list.length?list.length-1:0);render();persist()}function render(){let x=cur();$('count').textContent=list.length;$('seen').textContent=seen.size;$('kcount').textContent=known.size;$('ucount').textContent=unknown.size;$('pos').textContent=list.length?`${i+1} / ${list.length}`:'0 / 0';if(!x){$('word').textContent='没有匹配单词';$('meaning').textContent='请调整筛选条件';$('exEn').textContent='';$('exCn').textContent='';return}seen.add(x.w);$('word').textContent=x.w;$('ipa').textContent=x.ipa||'点击 🔊 听发音';$('meaning').textContent=x.cn;$('topicTag').textContent=x.topic;$('fw').textContent=stars(x.f.writing);$('fr').textContent=stars(x.f.reading);$('fl').textContent=stars(x.f.listening);showEx(x);$('spell').value='';$('fb').textContent='';$('seen').textContent=seen.size;persist()}function cur(){return list[i]}function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.88;speechSynthesis.speak(u)}function next(){if(list.length){i=(i+1)%list.length;render()}}fetch(URL).then(r=>r.text()).then(s=>{all=parse(s);$('status').textContent=`完整词库已加载 · ${all.length} 词`;topics();restoreControls();filter(true)}).catch(()=>{$('status').textContent='词库加载失败，请联网刷新'});['mod','freq','topic'].forEach(id=>$(id).onchange=()=>{i=0;filter(false)});$('q').oninput=()=>{i=0;filter(false)};$('speak').onclick=()=>cur()&&speak(cur().w);$('spex').onclick=()=>currentExample&&speak(currentExample.en);$('newex').onclick=()=>cur()&&showEx(cur());$('check').onclick=()=>{let x=cur(),v=$('spell').value.trim().toLowerCase();$('fb').textContent=!v?'先输入拼写。':v===x.w.toLowerCase()?'✓ 拼写正确！':`✗ 正确拼写：${x.w}`;$('fb').style.color=v===x.w.toLowerCase()?'#15803d':'#b42318'};$('known').onclick=()=>{let x=cur();known.add(x.w);unknown.delete(x.w);persist();next()};$('review').onclick=()=>{let x=cur();unknown.add(x.w);known.delete(x.w);persist();next()};$('next').onclick=next;$('random').onclick=()=>{if(list.length){i=Math.random()*list.length|0;render()}};$('allmode').onclick=()=>{rev=false;$('allmode').classList.add('active');$('unknownmode').classList.remove('active');i=0;filter(false)};$('unknownmode').onclick=()=>{rev=true;$('unknownmode').classList.add('active');$('allmode').classList.remove('active');i=0;filter(false)};$('reset').onclick=()=>{if(confirm('确定清空全部学习记录和进度吗？')){localStorage.removeItem(KEY);seen.clear();known.clear();unknown.clear();state={};rev=false;$('mod').value='all';$('freq').value='all';$('topic').value='all';$('q').value='';$('allmode').classList.add('active');$('unknownmode').classList.remove('active');i=0;filter(false)}};$('spell').onkeydown=e=>{if(e.key==='Enter')$('check').click()};window.addEventListener('beforeunload',persist);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist()});</script></body></html>
